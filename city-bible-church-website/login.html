<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City Bible Church</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">City Bible Church</a>
            </div>
            <!-- Basic nav for login/signup pages -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
            <button class="menu-toggle">☰</button> <!-- Keep for consistency if needed -->
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Login</h1>
                <p>Access your account</p>
            </div>
        </section>

        <section class="auth-form container">
            <h2>Enter Your Credentials</h2>
            <form id="login-form" class="styled-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="login-password" required>
                </div>
                <button type="submit" class="cta-button">Login</button>
            </form>
            <p id="login-message" style="margin-top: 15px; text-align: center;"></p>

            <div class="social-login" style="text-align: center; margin-top: 30px;">
                <p>Or login with:</p>
                <button class="social-button google" onclick="handleSocialLogin('google')">
                    <img src="images/google-icon.png" alt="Google" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Google
                </button>
                <button class="social-button yahoo" onclick="handleSocialLogin('yahoo')">
                    <img src="images/yahoo-icon.png" alt="Yahoo" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Yahoo
                </button>
                <button class="social-button facebook" onclick="handleSocialLogin('facebook')">
                    <img src="images/facebook-icon.png" alt="Facebook" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Facebook
                </button>
                <button class="social-button x" onclick="handleSocialLogin('x')">
                    <img src="images/x-icon.png" alt="X" style="width: 20px; vertical-align: middle; margin-right: 8px;"> X
                </button>
                <!-- Note: You'll need to add the actual icon images (google-icon.png, etc.) to the images folder -->
                <!-- Note: The handleSocialLogin function needs to be implemented in script.js -->
            </div>

            <p style="text-align: center; margin-top: 20px;">
                Don't have an account? <a href="signup.html">Sign Up here</a>.
            </p>
        </section>
    </main>

    <footer>
        <div class="footer-bottom">
            &copy; 2025 City Bible Church. All Rights Reserved.
        </div>
    </footer>

    <script src="js/script.js"></script>
    <!-- Add login specific script later in script.js -->
</body>
</html>

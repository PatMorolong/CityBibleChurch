<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - City Bible Church</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">City Bible Church</a>
            </div>
            <!-- Basic nav for login/signup pages -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <button class="menu-toggle">☰</button>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Sign Up</h1>
                <p>Create your account</p>
            </div>
        </section>

        <section class="auth-form container">
            <h2>Registration</h2>
            <form id="signup-form" class="styled-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" name="signup-name" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="signup-email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="signup-password" required>
                </div>
                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" name="signup-confirm" required>
                </div>
                <button type="submit" class="cta-button">Sign Up</button>
            </form>
            <p id="signup-message" style="margin-top: 15px; text-align: center;"></p>

            <p style="text-align: center; margin-top: 20px;">
                Already have an account? <a href="login.html">Login here</a>.
            </p>
        </section>
    </main>

    <footer>
        <div class="footer-bottom">
            &copy; 2025 City Bible Church. All Rights Reserved.
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
